<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Dashboard - Quiz Live</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .pins {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .setup-form, .waiting-room, .game-active, .game-ended {
      background: white;
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 1.1rem;
    }

    input, select {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #f5576c;
    }

    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(56, 239, 125, 0.4);
    }

    .btn-success:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .pin-display {
      font-size: 4rem;
      font-weight: bold;
      text-align: center;
      color: #f5576c;
      letter-spacing: 20px;
      padding: 20px;
      background: #fff5f5;
      border-radius: 15px;
      margin: 20px 0;
    }

    .pin-label {
      text-align: center;
      color: #666;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .players-list {
      margin-top: 20px;
    }

    .players-list h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    .player-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .player-count {
      text-align: center;
      font-size: 1.2rem;
      color: #666;
      margin-top: 15px;
    }

    .question-display {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .question-number {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .option-display {
      background: rgba(255,255,255,0.2);
      padding: 20px;
      border-radius: 10px;
      font-size: 1.1rem;
    }

    .timer-display {
      text-align: center;
      font-size: 5rem;
      font-weight: bold;
      color: #f5576c;
      margin: 20px 0;
    }

    .timer-display.warning {
      animation: pulse 0.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .leaderboard {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
    }

    .leaderboard h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 15px;
      background: #f8f9fa;
      margin-bottom: 8px;
      border-radius: 8px;
    }

    .leaderboard-item.gold {
      background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
      color: white;
    }

    .leaderboard-item.silver {
      background: linear-gradient(135deg, #bdc3c7 0%, #bdc3c7 100%);
      color: white;
    }

    .leaderboard-item.bronze {
      background: linear-gradient(135deg, #cd6133 0%, #cd6133 100%);
      color: white;
    }

    .rank { font-weight: bold; margin-right: 10px; }
    .name { flex: 1; }
    .score { font-weight: bold; margin-left: 10px; }

    .winner-announcement {
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border-radius: 15px;
      color: white;
      margin-bottom: 20px;
    }

    .winner-announcement h2 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .winner-name {
      font-size: 3rem;
      font-weight: bold;
      margin: 20px 0;
    }

    .winner-score {
      font-size: 1.5rem;
      opacity: 0.9;
    }

    .hidden { display: none !important; }
    
    .back-btn {
      display: inline-block;
      padding: 10px 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 20px;
      transition: background 0.3s;
    }
    
    .back-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .category-display {
      text-align: center;
      color: white;
      font-size: 1rem;
      opacity: 0.9;
      margin-top: 10px;
    }

    .correct-answer {
      background: #28a745 !important;
    }

    .answer-reveal {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .correct-option-text {
      font-size: 1.5rem;
      color: #28a745;
      font-weight: bold;
      margin: 15px 0;
    }

    .explanation-text {
      color: #666;
      font-size: 1rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">← Back</a>
  
  <div class="container">
    <div class="header">
      <h1>🎤 Host Dashboard</h1>
    </div>

    <div id="setup-form" class="setup-form">
      <div class="form-group">
        <label for="hostName">Your Name</label>
        <input type="text" id="hostName" placeholder="Enter your name" maxlength="20">
      </div>
      
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="general">General Knowledge</option>
          <option value="science">Science</option>
          <option value="history">History</option>
          <option value="geography">Geography</option>
          <option value="technology">Technology</option>
        </select>
      </div>
      
      <button class="btn btn-primary" onclick="createRoom()">Create Quiz Room</button>
    </div>

    <div id="waiting-room" class="waiting-room hidden">
      <p class="pin-label">Share this PIN with players:</p>
      <div class="pin-display" id="roomPin">----</div>
      <p class="category-display">Category: <span id="categoryName">General Knowledge</span></p>
      
      <div class="players-list">
        <h3>Players Waiting</h3>
        <div class="players-grid" id="playersGrid"></div>
        <p class="player-count" id="playerCount">0 players waiting</p>
      </div>
      
      <button class="btn btn-success" id="startBtn" onclick="startQuiz()" disabled>
        Start Quiz (need at least 1 player)
      </button>
    </div>

    <div id="game-active" class="game-active hidden">
      <div class="question-display">
        <p class="question-number" id="questionNumber">Question 1 of 12</p>
        <p class="question-text" id="questionText">Loading...</p>
        <div class="options-grid" id="optionsGrid"></div>
      </div>
      
      <div class="timer-display" id="timerDisplay">15</div>
      
      <div class="leaderboard">
        <h3>Live Leaderboard</h3>
        <div id="liveLeaderboard"></div>
      </div>
    </div>

    <div id="answer-reveal" class="answer-reveal hidden">
      <h3>Correct Answer</h3>
      <p class="correct-option-text" id="correctAnswerText"></p>
      <p class="explanation-text" id="explanationText"></p>
    </div>

    <div id="game-ended" class="game-ended hidden">
      <div class="winner-announcement">
        <h2>🏆 Quiz Complete!</h2>
        <p>Winner</p>
        <p class="winner-name" id="winnerName">-</p>
        <p class="winner-score" id="winnerScore">0 points</p>
      </div>
      
      <div class="leaderboard">
        <h3>Final Standings</h3>
        <div id="finalLeaderboard"></div>
      </div>
      
      <a href="index.html" class="btn btn-primary" style="display: block; text-align: center; text-decoration: none; margin-top: 20px;">
        Back to Home
      </a>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let roomPin = null;

    socket.on('connect', () => {
      console.log('Connected to server');
    });

    function createRoom() {
      const hostName = document.getElementById('hostName').value.trim();
      const category = document.getElementById('category').value;
      
      if (!hostName) {
        alert('Please enter your name');
        return;
      }
      
      socket.emit('quiz:create', { hostName, category });
    }

    socket.on('quiz:created', ({ pin, roomId }) => {
      roomPin = pin;
      document.getElementById('roomPin').textContent = pin;
      
      const categorySelect = document.getElementById('category');
      document.getElementById('categoryName').textContent = categorySelect.options[categorySelect.selectedIndex].text;
      
      document.getElementById('setup-form').classList.add('hidden');
      document.getElementById('waiting-room').classList.remove('hidden');
    });

    socket.on('lobby:update', ({ players }) => {
      const playersGrid = document.getElementById('playersGrid');
      playersGrid.innerHTML = '';
      
      players.forEach(player => {
        const playerCard = document.createElement('div');
        playerCard.className = 'player-card';
        playerCard.textContent = player.name;
        playersGrid.appendChild(playerCard);
      });
      
      const count = players.length;
      document.getElementById('playerCount').textContent = `${count} player${count !== 1 ? 's' : ''} waiting`;
      
      const startBtn = document.getElementById('startBtn');
      if (count >= 1) {
        startBtn.disabled = false;
        startBtn.textContent = 'Start Quiz';
      } else {
        startBtn.disabled = true;
        startBtn.textContent = 'Start Quiz (need at least 1 player)';
      }
    });

    function startQuiz() {
      if (roomPin) {
        socket.emit('quiz:start', { pin: roomPin });
        document.getElementById('waiting-room').classList.add('hidden');
        document.getElementById('game-active').classList.remove('hidden');
      }
    }

    socket.on('question:start', (data) => {
      document.getElementById('answer-reveal').classList.add('hidden');
      document.getElementById('game-active').classList.remove('hidden');
      
      document.getElementById('questionNumber').textContent = 
        `Question ${data.questionIndex + 1} of ${data.totalQuestions}`;
      document.getElementById('questionText').textContent = data.question;
      
      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';
      
      const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71'];
      data.options.forEach((option, index) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option-display';
        optionDiv.style.background = colors[index];
        optionDiv.style.color = 'white';
        optionDiv.textContent = `${String.fromCharCode(65 + index)}: ${option}`;
        optionsGrid.appendChild(optionDiv);
      });
      
      startTimer(data.timeLimitSeconds);
    });

    let timerInterval;
    function startTimer(seconds) {
      clearInterval(timerInterval);
      const timerDisplay = document.getElementById('timerDisplay');
      let timeLeft = seconds;
      
      timerDisplay.textContent = timeLeft;
      timerDisplay.classList.remove('warning');
      
      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        
        if (timeLeft <= 5 && timeLeft > 0) {
          timerDisplay.classList.add('warning');
        }
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerDisplay.classList.remove('warning');
        }
      }, 1000);
    }

    socket.on('question:time_up', ({ correctOption, explanation }) => {
      clearInterval(timerInterval);
      document.getElementById('timerDisplay').textContent = '0';
      
      const options = document.querySelectorAll('.option-display');
      if (options[correctOption]) {
        options[correctOption].classList.add('correct-answer');
      }
      
      setTimeout(() => {
        document.getElementById('game-active').classList.add('hidden');
        const answerReveal = document.getElementById('answer-reveal');
        answerReveal.classList.remove('hidden');
        
        const correctText = String.fromCharCode(65 + correctOption);
        document.getElementById('correctAnswerText').textContent = correctText + ': ' + options[correctOption].textContent.split(': ')[1];
        document.getElementById('explanationText').textContent = explanation || '';
      }, 1000);
    });

    socket.on('leaderboard:update', ({ leaderboard }) => {
      const leaderboardDiv = document.getElementById('liveLeaderboard');
      renderLeaderboard(leaderboardDiv, leaderboard);
    });

    socket.on('quiz:ended', ({ winner, finalRanks }) => {
      clearInterval(timerInterval);
      document.getElementById('game-active').classList.add('hidden');
      document.getElementById('answer-reveal').classList.add('hidden');
      document.getElementById('game-ended').classList.remove('hidden');
      
      if (winner) {
        document.getElementById('winnerName').textContent = winner.name;
        document.getElementById('winnerScore').textContent = `${winner.score} points`;
      }
      
      const leaderboardDiv = document.getElementById('finalLeaderboard');
      renderLeaderboard(leaderboardDiv, finalRanks);
    });

    function renderLeaderboard(container, leaderboard) {
      container.innerHTML = '';
      
      leaderboard.forEach((entry, index) => {
        const item = document.createElement('div');
        item.className = 'leaderboard-item';
        
        if (entry.rank === 1) item.classList.add('gold');
        else if (entry.rank === 2) item.classList.add('silver');
        else if (entry.rank === 3) item.classList.add('bronze');
        
        const medal = entry.rank === 1 ? '🥇' : entry.rank === 2 ? '🥈' : entry.rank === 3 ? '🥉' : `${entry.rank}.`;
        
        item.innerHTML = `
          <span class="rank">${medal}</span>
          <span class="name">${entry.name}</span>
          <span class="score">${entry.score}</span>
        `;
        
        container.appendChild(item);
      });
    }

    socket.on('error', ({ message }) => {
      alert('Error: ' + message);
    });

    socket.on('disconnect', () => {
      console.log('Disconnected from server');
      alert('Disconnected from server. Please refresh the page.');
    });
  </script>
</body>
</html>
